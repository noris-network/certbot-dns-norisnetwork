stages:
- build
- publish
- release

variables:
  DOCKER_AUTH_CONFIG: $DOCKER_AUTH_CONFIG_HARBOR

image: $IMAGE_REPOSITORY/python:3.11-alpine

.env_before_script: &env_before_script
  before_script:
    - pip install -U pip
    - pip install 'twine~=6.0'

build_universal:
  stage: build
  script:
    - apk add git
    - pip install --upgrade pip build setuptools-scm
    - VERSION=$(python -m setuptools_scm)
    - echo $VERSION > VERSION.txt
    - python -m build
  artifacts:
    paths:
      - dist
      - VERSION.txt
  only:
    - tags

publish_universal:
  stage: publish
  <<: *env_before_script
  script:
    - twine upload -p pypi-$TWINE_TOKEN --disable-progress-bar dist/*
  needs:
    - build_universal
  only:
    - tags

docker_image_release:
  stage: release
  image: $IMAGE_REPOSITORY/docker:latest
  script:
    - BUILD_VERSION=$(cat VERSION.txt)
    - docker login -u "$DOCKERHUB_USER" -p "$DOCKERHUB_TOKEN"
    - docker build --no-cache --build-arg BUILD_VERSION=$BUILD_VERSION -t "$DOCKERHUB_USER/certbot-dns-norisnetwork:latest" -t "$DOCKERHUB_USER/certbot-dns-norisnetwork:$BUILD_VERSION" .
    - docker push -a "$DOCKERHUB_USER/certbot-dns-norisnetwork"
  when: delayed
  start_in: 300 seconds
  needs:
    - publish_universal
  only:
    - tags
