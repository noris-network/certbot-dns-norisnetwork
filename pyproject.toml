[build-system]
requires = ["setuptools >= 80.0.0", "setuptools-scm >= 8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "certbot-dns-norisnetwork"
description = "noris network DNS Authenticator Plugin for Certbot"
readme = { file = "README.md", content-type = "text/markdown" }
urls = { Homepage = "https://github.com/noris-network/certbot-dns-norisnetwork" }
authors = [
    {name="Anastasia Skoufa", email="anastasia.skoufa@noris.gr"}
]
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "certbot==5.1.0",
    "pytest~=8.4",
    "pytest-cov~=6.3",
    "requests==2.32.5",
    "types-requests~=2.32",
]
classifiers = [
    "Environment :: Plugins",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["black", "mypy", "pip-tools", "pylint"]

[project.entry-points."certbot.plugins"]
dns-noris = "certbot_dns_norisnetwork.dns_noris:Authenticator"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests"]

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"
fallback_version = "0.1.0"

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
